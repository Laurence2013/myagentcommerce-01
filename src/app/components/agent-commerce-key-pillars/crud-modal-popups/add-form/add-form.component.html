<div class="add-form-container">
  <section class="single-line-section">
    <h1>Add new documents</h1> - <h4>{{ getItemIdUpper() }}</h4>
  </section>

  <div class="form-row-side-by-side">
    <div class="form-group">
      <label class="form-label" for="add-protocol-name">Protocol Name</label>
      <input
        id="add-protocol-name"
        type="text"
        class="form-control"
        placeholder="Enter protocol name"
        [value]="formName()"
        (input)="onNameInput($event)"
      />
    </div>
    <div class="form-group">
      <label class="form-label" for="add-protocol-values">Values</label>
      <input
        id="add-protocol-values"
        type="text"
        class="form-control"
        placeholder="Enter values (e.g. Layer 1, Layer 2)"
        [value]="formValues()"
        (input)="onValuesInput($event)"
      />
    </div>
  </div>
</div>

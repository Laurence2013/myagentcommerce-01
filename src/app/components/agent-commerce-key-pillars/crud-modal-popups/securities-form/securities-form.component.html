<div class="securities-form-container">
  <div class="form-header-actions">
    <button type="button" class="btn-clear" (click)="resetForm()" title="Clear form fields">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
      Clear Form
    </button>
  </div>

  <form class="securities-form" (submit)="$event.preventDefault()">
    <!-- Name Field -->
    <div class="form-group">
      <div class="label-row">
        <label for="sec-name" class="form-label">Name</label>
        <span class="field-badge required-badge">Required</span>
      </div>
      <input
        type="text"
        id="sec-name"
        class="form-control"
        [value]="formName()"
        (input)="onNameInput($event)"
        placeholder="Enter security name..."
      />
    </div>

    <!-- Capabilities Field -->
    <div class="form-group">
      <div class="label-row">
        <label for="sec-capability" class="form-label">Capabilities</label>
        <span class="field-badge hint-badge">Comma-separated</span>
      </div>
      <input
        type="text"
        id="sec-capability"
        class="form-control"
        [value]="formCapability()"
        (input)="onCapabilityInput($event)"
        placeholder="e.g. Identity Assertion, Cryptographic Proofs"
      />
    </div>

    <!-- Primary Risk Mitigated Field -->
    <div class="form-group">
      <div class="label-row">
        <label for="sec-primary-risk" class="form-label">Primary Risk Mitigated</label>
        <span class="field-badge hint-badge">Comma-separated</span>
      </div>
      <input
        type="text"
        id="sec-primary-risk"
        class="form-control"
        [value]="formPrimaryRiskMitigated()"
        (input)="onPrimaryRiskInput($event)"
        placeholder="e.g. Identity Spoofing, Man-in-the-middle"
      />
    </div>

    <!-- Protocols Field -->
    <div class="form-group">
      <div class="label-row">
        <label for="sec-protocols" class="form-label">Protocols</label>
        <span class="field-badge hint-badge">Comma-separated</span>
      </div>
      <input
        type="text"
        id="sec-protocols"
        class="form-control"
        [value]="formProtocols()"
        (input)="onProtocolsInput($event)"
        placeholder="e.g. TLS 1.3, mTLS, W3C DID"
      />
    </div>

    <!-- Mechanisms Field -->
    <div class="form-group">
      <div class="label-row">
        <label for="sec-mechanisms" class="form-label">Mechanisms</label>
        <span class="field-badge hint-badge">Comma-separated</span>
      </div>
      <input
        type="text"
        id="sec-mechanisms"
        class="form-control"
        [value]="formMechanisms()"
        (input)="onMechanismsInput($event)"
        placeholder="e.g. Zero Knowledge Proofs, Hardware Enclaves"
      />
    </div>
  </form>
</div>
